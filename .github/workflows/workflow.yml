name: CI Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Prepare Python 3.9 environment
        run: |
          mkdir -p $RUNNER_TOOL_CACHE/Python/3.9.25/x64
          curl -sL https://github.com/actions/python-versions/releases/download/3.9.25-40340363276/python-3.9.25-linux-24.04-x64.tar.gz | tar -xz -C $RUNNER_TOOL_CACHE/Python/3.9.25/x64
          touch $RUNNER_TOOL_CACHE/Python/3.9.25/x64.complete

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 service tests --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with nose
        run: |
          nosetests -v --with-spec --spec-color
