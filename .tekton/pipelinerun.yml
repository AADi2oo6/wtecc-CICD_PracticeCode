apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: oc-green
spec:
  pipelineRef:
    name: oc-final
  params:
    - name: repo-url
      value: "https://github.com/AADi2oo6/wtecc-CICD_PracticeCode.git"
    - name: branch
      value: "main"
    - name: build-image
      value: "image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/counter-service:latest"
  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: oc-pipelines-pvc
